<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cầu Vồng</title>
    <style>
        /* Đặt nền đen để chữ cầu vồng nổi bật hơn */
        body {
            background-color: #0d0d0d;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }

        /* Định dạng chữ su ngơn */
        .rainbow-text {
            font-size: 5rem;
            font-weight: 900;
            text-transform: uppercase;
            text-align: center;
            
            /* Tọa hiệu ứng dải màu cầu vồng */
            background: linear-gradient(
                90deg, 
                #ff0000, #ff7f00, #ffff00, #00ff00, #00ffff, #0000ff, #8b00ff, #ff0000
            );
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            
            /* Chạy hiệu ứng cuộn màu và nhấp nháy */
            animation: rainbow 3s linear infinite, blink 0.6s ease-in-out infinite alternate;
            
            /* Hiệu ứng đổ bóng sáng phát quang (Glow effect) */
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.6));
        }

        /* Animation chuyển màu cầu vồng */
        @keyframes rainbow {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        /* Animation nhấp nháy (chớp tắt nhẹ) */
        @keyframes blink {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0.3; transform: scale(1.05); }
        }

        /* Tối ưu cho màn hình điện thoại */
        @media (max-width: 600px) {
            .rainbow-text {
                font-size: 3rem;
            }
        }
    </style>
</head>
<body>

    <div class="rainbow-text">chao đi</div>

</body>
</html>
